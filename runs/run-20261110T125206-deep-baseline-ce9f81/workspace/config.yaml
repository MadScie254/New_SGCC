random_state: 42
data:
  training_data_path: C:\Users\MadScie254\Documents\GitHub\New_SGCC\data\sgcc_full.csv
  serving_data_path: data/sgcc_demo.csv.gz
preprocessing:
  short_gap_days: 3
  cap_kwh: 10000
  outlier_sigma: 3
  zero_run_days: 30
resampling:
  sampling_strategy: 0.5
  smote_k_neighbors: 5
  enn_n_neighbors: 3
features:
  sudden_drop_threshold: 0.5
  peak_day_percentile: 0.9
  missing_sequence_threshold: 3
  low_month_ratio: 0.2
  monthly_profile_months: 34
  start_date: '2014-01-01'
model:
  type: xgboost
  version: 3.0.0
  device: cpu
  optuna:
    n_trials: 40
    cv_folds: 5
    timeout: null
    metric: average_precision
    search_space:
      n_estimators:
        low: 100
        high: 500
        step: 50
      learning_rate:
        low: 0.01
        high: 0.3
        log: true
      max_depth:
        low: 3
        high: 9
      min_child_weight:
        low: 1
        high: 20
        log: true
      subsample:
        low: 0.6
        high: 1.0
      colsample_bytree:
        low: 0.3
        high: 1.0
      gamma:
        low: 0.0
        high: 5.0
      reg_alpha:
        low: 0.001
        high: 10.0
        log: true
      reg_lambda:
        low: 0.01
        high: 20.0
        log: true
    scale_pos_weight:
      none:
        low: 1.0
        high: 10.72
      smote_enn:
        low: 1.0
        high: 3.0
  sequence_file: models/sequence.onnx
  hybrid:
    enabled: true
    weight_step: 0.05
    sequence:
      max_epochs: 60
      patience: 6
      batch_size: 256
      learning_rate: 0.001
  quick_train:
    sample_fraction: 0.25
    n_trials: 5
    cv_folds: 3
evaluation:
  validation_size: 0.15
  test_size: 0.15
  early_stopping_rounds: 50
  threshold_strategy: f1
  min_precision: 0.5
serving:
  population_customers: 3000
paths:
  models: models
  model_file: models/xgb_best.ubj
  artifacts: artifacts
