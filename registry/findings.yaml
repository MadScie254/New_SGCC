# GridSentinel X - Ledger of reported findings
#
# Every number here was typed from the documents of the original study (the sgcc repository at
# commit 081e814: README.md, docs/proposal-alignment.md, docs/data-quality.md), at the precision
# those documents print. They are REPORTED findings. A finding becomes VERIFIED only when a sealed
# rerun of its experiment under the original protocol lands inside the tolerance declared below.
#
# The tolerances were written on 2026-11-10, before any rerun in this repository had finished.
# Changing one after seeing a result would be a protocol violation; the file's SHA-256 is recorded
# in every run that is checked against it.
#
# Outcome of a check:
#   exact             the rerun value, rounded to the reported decimals, equals the reported value
#   within_tolerance  |rerun - reported| <= tolerance
#   discrepant        anything else; both values are kept and the difference is shown
#
# Classes and their tolerances:
#   deterministic  seeded tree, forest and linear models, counts and statistics computed from saved
#                  predictions. Expected to reproduce exactly; 0.002 allows for floating-point
#                  summation order on a different CPU and thread count.
#   stochastic     anything that involves training the CNN. The original study itself reports that
#                  the hybrid's test PR-AUC varies with the training seed (0.631 +/- 0.011 over five
#                  seeds) and PyTorch does not promise identical results across builds and CPUs.
#                  Ranking metrics: 0.03 (about 2.5 reported seed SDs). Metrics at a threshold
#                  (recall, precision, F1, MCC, G-Mean) move more because the threshold is re-chosen
#                  on validation: 0.06.
#   count          integers that must match exactly.
#   hardware       timings. Recorded, never verified: they depend on the machine.

tolerances:
  deterministic: 0.002
  stochastic_ranking: 0.03
  stochastic_threshold: 0.06
  count: 0

