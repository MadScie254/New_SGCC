id: hybrid.significance
version: 1
title: Paired tests of the hybrid against its two parts on the study split
protocol: original
phase: documented_extension
kind: statistics
summary: >
  Paired stratified bootstrap (10,000 resamples, Holm) and McNemar exact test of the hybrid against
  standard XGBoost and the CNN, from the training run's saved test predictions. Nothing is refitted.
command: ["scripts/hybrid_study.py", "--significance"]
needs: [train.full, hybrid.splits]
needs_data: false
needs_torch: true
expected_minutes: 2
pipelines: [hybrid, wide_deep_cnn, xgboost]
thesis: [RQ4, "Fig 5.26"]
leakage_controls:
  - Uses only predictions saved by the training run; thresholds are the validation-chosen ones.
outputs: [artifacts/hybrid_study.json]
progress:
  - {pattern: "resamples$", stage: "Bootstrap", span: [0.05, 0.95], count: 10}
